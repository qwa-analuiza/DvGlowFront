<div class="fundo" (click)="cancelar()">
  <form class="janela" [formGroup]="formulario" (ngSubmit)="salvar()" (click)="$event.stopPropagation()"
        role="dialog" aria-modal="true" novalidate>

    <header class="topo">
      <div>
        <p class="etiqueta">{{ editando ? 'Edição' : 'Novo cadastro' }}</p>
        <h2>{{ editando ? 'Editar produto' : 'Adicionar produto' }}</h2>
      </div>
      <button class="fechar" type="button" (click)="cancelar()" aria-label="Fechar">
        <app-icone nome="fechar" [tamanho]="16"></app-icone>
      </button>
    </header>

    <div class="corpo">
      <div class="coluna-foto">
        <span class="rotulo">Fotos do produto</span>
        <label class="area-foto" [class.com-foto]="imagensExibidas.length > 0">
          <input type="file" accept="image/jpeg,image/png,image/webp" (change)="escolherImagens($event)" multiple hidden>
          <img *ngIf="imagensExibidas.length > 0; else vazia" [src]="imagensExibidas[0]" alt="Prévia da foto do produto">
          <ng-template #vazia>
            <app-icone nome="imagem" [tamanho]="22"></app-icone>
            <span>Clique para escolher até 3 fotos</span>
          </ng-template>
          <span class="trocar" *ngIf="imagensExibidas.length > 0">Trocar fotos</span>
        </label>
        <div class="miniaturas-fotos" *ngIf="imagensExibidas.length > 1">
          <img *ngFor="let imagem of imagensExibidas; let indice = index"
               [src]="imagem" [alt]="'Prévia da foto ' + (indice + 1) + ' do produto'">
        </div>
        <small>Até 3 fotos. JPG, PNG ou WEBP. Máximo 1,5 MB por foto.</small>
      </div>

      <div class="coluna-dados">
        <label class="admin-campo">
          <span>Nome do produto</span>
          <input class="admin-entrada" type="text" formControlName="nome" placeholder="Ex.: Base Líquida Matte" maxlength="120">
        </label>

        <div class="linha">
          <label class="admin-campo">
            <span>Preço</span>
            <div class="preco">
              <span class="moeda">R$</span>
              <input class="admin-entrada" type="text" inputmode="decimal" formControlName="preco" placeholder="0,00">
            </div>
          </label>

          <label class="admin-campo">
            <span>Categoria</span>
            <select class="admin-entrada" formControlName="categoria">
              <option *ngFor="let categoria of categorias" [value]="categoria">{{ categoria }}</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <footer class="rodape">
      <p class="admin-erro" *ngIf="erro">{{ erro }}</p>
      <div class="botoes">
        <button class="admin-botao admin-botao-contorno" type="button" (click)="cancelar()" [disabled]="salvando">Cancelar</button>
        <button class="admin-botao admin-botao-primario" type="submit" [disabled]="salvando">
          {{ salvando ? 'Salvando...' : editando ? 'Salvar alterações' : 'Adicionar produto' }}
        </button>
      </div>
    </footer>
  </form>
</div>
